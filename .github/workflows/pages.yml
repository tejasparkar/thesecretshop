name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['client/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - name: Check VITE_API_URL
        run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then echo '::error::Repo variable VITE_API_URL is not set (Settings > Secrets and variables > Actions > Variables)'; exit 1; fi
      - run: npm run build
        working-directory: client
        env:
          # Repo variable (Settings → Secrets and variables → Actions → Variables):
          # your Railway backend URL, e.g. https://thesecretshop-production.up.railway.app
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # Served at the root of the custom domain thesecretshop.in
          VITE_BASE: /
      # GitHub Pages has no SPA fallback; serving index.html as 404.html makes deep links work.
      - run: |
          cp client/dist/index.html client/dist/404.html
          echo 'thesecretshop.in' > client/dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
